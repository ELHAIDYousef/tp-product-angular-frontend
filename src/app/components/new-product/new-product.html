<div class="p-3">
  <div class="card col-md-6 offset-md-3 shadow">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0">New Product Entry</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="productForm" (ngSubmit)="handleSaveProduct()">
        <div class="mb-3">
          <label class="form-label">Product Name</label>
          <input type="text" formControlName="name" class="form-control" [class.is-invalid]="productForm.get('name')?.invalid && productForm.get('name')?.touched">
        </div>

        <div class="mb-3">
          <label class="form-label">Category</label>
          <select formControlName="category" class="form-select" [class.is-invalid]="productForm.get('category')?.invalid && productForm.get('category')?.touched">
            <option [ngValue]="null">-- Select Category --</option>
            @for (cat of categories; track cat.id) {
              <option [ngValue]="cat">{{cat.name}}</option>
            }
          </select>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Price</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" formControlName="price" class="form-control">
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" formControlName="quantity" class="form-control">
          </div>
        </div>

        <div class="mb-3 form-check form-switch">
          <input type="checkbox" formControlName="checked" class="form-check-input" id="checkId">
          <label class="form-check-label" for="checkId">Available in Inventory</label>
        </div>

        <div class="d-grid gap-2">
          <button [disabled]="productForm.invalid" class="btn btn-success shadow-sm">
            <i class="bi bi-save"></i> Save Product
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
